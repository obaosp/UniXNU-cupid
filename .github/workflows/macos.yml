name: macOS kernel build

# Builds the arm64e iOS 27 XNU for cupid on a GitHub macOS runner. This is the
# reproducible host check while the phone is not attached: it resolves the
# iOS 27 profile, fetches the pinned sources, decodes the iPhone17,2 kernelcache
# and prelinks the kernel. It publishes text logs only (no Apple images).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "board.toml"
      - "feeds.toml"
      - "configs/**"
      - "dts/**"
      - "profiles/**"
      - "patches/**"
      - "scripts/**"
      - ".github/workflows/macos.yml"

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      UNIXNU_DEVICE: ${{ github.workspace }}/device
      # prepare-xnu-source.py lists Apple sources through the GitHub API.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: device
          persist-credentials: false

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: UniXNU
          persist-credentials: false

      - name: Check out the firmware repository
        uses: actions/checkout@v4
        with:
          repository: obaosp/uefi-cupid
          path: uefi-cupid
          persist-credentials: false

      - name: Check out the firmware submodules
        working-directory: uefi-cupid
        run: |
          git submodule update --init --depth 1 \
            Common/Mu Common/Mu_OEM_Sample Mu_Basecore Silicium-ACPI \
            Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl

      - name: Repair the stale ArmCpu gitlink
        working-directory: UniXNU
        run: |
          # UniXNU main pins drivers/ArmCpu at 2e11cda72740b985dedde3e32ba72b0fd64eb475.
          # The upstream repository no longer contains that commit (it was rebased),
          # so `git submodule update --init --recursive` fails in unixnu fetch/build.
          # Pin the index to the existing ArmCpu main commit for this build.
          git update-index --cacheinfo 160000,93a5030c5d983d0ef90f0fca93879d6e36ad1ba8,drivers/ArmCpu
          git ls-tree HEAD drivers/ArmCpu

      - name: Apply device-side UniXNU fixes
        working-directory: UniXNU
        run: |
          shopt -s nullglob
          for patch in ../device/patches/unixnu/*.patch; do
            echo "applying $(basename "$patch")"
            git apply "$patch"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      - name: Report the toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version
          for tool in git make clang cmake ninja unifdef ld.lld mformat mcopy dtc fdtoverlay xcodebuild; do
            printf '%-10s %s\n' "$tool" "$(command -v "$tool" || echo MISSING)"
          done
          df -h "$GITHUB_WORKSPACE"

      - name: Install the iOS 27 profile
        working-directory: device
        run: scripts/install-os-profile.sh ../UniXNU

      - name: Resolve the configuration
        id: status
        working-directory: UniXNU
        run: |
          ./unixnu defconfig cupid_ios27_defconfig -D ../device
          ./unixnu fetch -D ../device
          ./unixnu status --json -D ../device | tee "$RUNNER_TEMP/status.json"
          python3 - "$RUNNER_TEMP/status.json" <<'PY'
          import json, sys
          status = json.load(open(sys.argv[1]))
          text = json.dumps(status)
          for needle in ("ios-27.0.1-24A446", "arm64e", "sm8450", "cupid_ios27"):
              if needle not in text:
                  sys.exit(f"::error::resolved status is missing {needle}")
          print("status resolves the iOS 27 arm64e profile, the sm8450 source and the cupid defconfig")
          PY

      - name: Install the XnuPrelink reviewed symbols
        working-directory: UniXNU
        run: |
          test -d kits/XnuPrelink/fixtures
          install -m 0644 \
            ../device/patches/xnuprelink/fileset-cupid-24A446-symbols.json \
            kits/XnuPrelink/fixtures/fileset-cupid-24A446-symbols.json
          python3 -c 'import json,sys; d=json.load(open("kits/XnuPrelink/fixtures/fileset-cupid-24A446-symbols.json")); print("reviewed functions:", len(d["functions"]), "kernelcache:", d["inputs"]["kernelcache_sha256"])'

      - name: Build the cupid device tree
        id: dtb
        working-directory: device
        run: scripts/build-cupid-dtb.sh

      - name: Build the kernel
        id: kernel
        working-directory: UniXNU
        run: ./unixnu build kernel -D ../device

      - name: Prelink mapping summary
        if: always()
        working-directory: UniXNU
        run: |
          LOG=$(find out/cupid -name prelink.log | head -1)
          if [ -n "$LOG" ]; then
            echo "== $LOG"
            tail -5 "$LOG"
          fi
          REPORT=$(find out/cupid -path '*/kernel/kernel.json' | head -1)
          if [ -n "$REPORT" ]; then
          python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));s=d.get("stubbed",{});m=d.get("missing",{});print("allow_missing",d.get("allow_missing"),"mapping_complete",d.get("mapping_complete"));print("stubbed_targets",sum(len(v) for v in s.values()),"sites",sum(sum(v.values()) for v in s.values()));print("missing_targets",sum(len(v) for v in m.values()));[print("owner",k,"stubbed",len(s.get(k,{})),"missing",len(m.get(k,{}))) for k in sorted(set(s)|set(m))]' "$REPORT"
          else
            echo "no kernel report"
          fi

      - name: Kernel panic diagnostics
        if: always()
        working-directory: UniXNU
        run: |
          export PATH="/opt/homebrew/opt/llvm/bin:$PATH"
          K=$(find out/cupid -path '*/kernel/kernel.macho' | head -1)
          [ -n "$K" ] || { echo "no kernel.macho"; exit 0; }
          {
            echo "kernel: $K"
            echo "bytes: $(wc -c < "$K")"
            llvm-nm -n "$K" > "$RUNNER_TEMP/syms.txt" 2>/dev/null || true
            PC=0xfffffff00ad881c0
            python3 - "$PC" "$RUNNER_TEMP/syms.txt" <<'PY2'
          import sys
          pc=int(sys.argv[1],16); best=None
          for line in open(sys.argv[2]):
              p=line.split()
              if len(p)>=3:
                  try: a=int(p[0],16)
                  except ValueError: continue
                  if a<=pc and (best is None or a>best[0]): best=(a,p[2])
          print("nearest:", hex(best[0]), best[1], "offset", hex(pc-best[0]) if best else "?")
          PY2
            llvm-objdump -d --start-address=0xfffffff00ad88160 --stop-address=0xfffffff00ad88220 "$K" | tail -50
          } > "$RUNNER_TEMP/kernel-diag.txt" 2>&1
          cat "$RUNNER_TEMP/kernel-diag.txt"

      - name: Upload kernel diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cupid-kernel-diag
          path: ${{ runner.temp }}/kernel-diag.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Patch DarwinBoot window diagnostics
        working-directory: UniXNU
        run: |
          git -C drivers/DarwinBoot apply \
            "$GITHUB_WORKSPACE/device/patches/darwinboot/0001-darwinboot-log-window-failure.patch"

      - name: Build the package
        id: package
        working-directory: UniXNU
        run: ./unixnu build package -D ../device

      - name: Build the firmware
        id: firmware
        working-directory: UniXNU
        run: ./unixnu build firmware -D ../device --uefi ../uefi-cupid

      - name: Build the payload
        id: payload
        working-directory: UniXNU
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: ./unixnu build payload -D ../device --uefi ../uefi-cupid --unique-chip-id "$UNIXNU_UNIQUE_CHIP_ID"

      - name: Build the boot image
        id: bootimg
        working-directory: UniXNU
        run: |
          ./unixnu bootimg -D ../device --uefi ../uefi-cupid \
            --dtb ../device/build/cupid/cupid.dtb

      - name: Upload the boot image
        if: always() && steps.bootimg.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cupid-bootimg
          path: |
            UniXNU/out/cupid/*/*/boot/boot.img
            UniXNU/out/cupid/*/*/payload/payload.img
          if-no-files-found: error
          retention-days: 7

      - name: Collect text logs
        if: always() && steps.status.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cp "$RUNNER_TEMP/status.json" "$RUNNER_TEMP/logs/" 2>/dev/null || true
          find out/cupid -type f -name '*.log' -exec cp {} "$RUNNER_TEMP/logs/" \; 2>/dev/null || true
          find out/cupid -type f -name '*.json' -path '*prelink*' -exec cp {} "$RUNNER_TEMP/logs/" \; 2>/dev/null || true
          ls -la "$RUNNER_TEMP/logs"

      - name: Upload logs
        if: always() && steps.status.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cupid-ios27-kernel-logs
          path: ${{ runner.temp }}/logs/*
          if-no-files-found: warn
          retention-days: 7

      - name: Remove Apple inputs
        if: always()
        run: rm -rf out/ipsw out/feeds device/.cache/firmware out/cupid/*/*/tree/.cache/firmware

      - name: Summary
        if: always()
        env:
          KERNEL: ${{ steps.kernel.outcome }}
        run: |
          {
            echo "## cupid / iOS 27.0.1 (24A446, arm64e)"
            echo
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| resolve (defconfig, fetch, status) | ${{ steps.status.outcome }} |"
            echo "| kernel + prelink | ${KERNEL:-skipped} |"
            echo "| package (UniXNU.efi) | ${{ steps.package.outcome }} |"
            echo "| firmware (SILICIUM_UEFI.fd) | ${{ steps.firmware.outcome }} |"
            echo "| cupid.dtb | ${{ steps.dtb.outcome }} |"
            echo "| payload.img | ${{ steps.payload.outcome }} |"
            echo "| boot.img | ${{ steps.bootimg.outcome }} |"
            echo
            echo "iPhone17,2 (D94AP) profile, SM8450 SoC source, cupid defconfig. Text logs only."
          } >> "$GITHUB_STEP_SUMMARY"
