name: iOS 26 root images

# One-off: decrypt the iPhone17,2 26.5.2 OS and Cryptex1,SystemOS images with
# macOS /usr/bin/aea and print their APFS volume UUIDs and raw image sha256
# values for profiles/os/ios-26.5.2-23F84 [root]. Text only; Apple images are
# removed before the job ends.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roots:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: device
          persist-credentials: false

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: UniXNU
          persist-credentials: false

      - name: Install tools
        run: |
          brew install blacktop/tap/ipsw
          for tool in aea ipsw hdiutil diskutil; do
            command -v "$tool" || { echo "missing $tool"; exit 1; }
          done

      - name: Read the root volume identities
        run: python3 device/tools/ios26-roots.py UniXNU | tee "$RUNNER_TEMP/roots.log"

      - name: Upload text log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios26-roots
          path: ${{ runner.temp }}/roots.log
          if-no-files-found: warn
          retention-days: 3

      - name: Remove Apple inputs
        if: always()
        run: rm -rf UniXNU/out/ipsw
