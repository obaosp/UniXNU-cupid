["os"]
"name" = "ios-26.5.2-23F84"
"arch" = "arm64e"
"darwin" = "25.5.0"
# iPhone17,2 26.5.2 ships kernelcache xnu-12377.122.8~1/RELEASE_ARM64_T8140 (Darwin 25.5.0). The newest
# public source is xnu-12377.121.6: the same major/minor as the kernel, which is why this profile runs the
# 12377 source without the Darwin 26 syscall/KPI additions that 24A446 needs.
"xnu_version" = "12377.121.6"
"xnu_revision" = "ac9718fb1af618d5ce8678d0dc6e8a58f252216f"
"driverkit_tag" = "xnu-12377.121.6"
"trustcache_tag" = "xnu-8796.101.5"
"ios_version" = "26.0"
"abi" = []


["ipsw"]
# iPhone 16 Pro Max. kernelcache.release.iphone17 decompresses to a 302-entry arm64e MH_FILESET.
"url" = "https://updates.cdn-apple.com/2026SpringFCS/fullrestores/140-26194/0358D1F3-1C15-44F7-A711-93D2987CA188/iPhone17,2_26.5.2_23F84_Restore.ipsw"
"product" = "iPhone17,2"
"version" = "26.5.2"
"build" = "23F84"
"device_class" = "d94ap"
"chip_id" = 33088
"board_id" = 14
"fetch" = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]


["kernel"]

["kernel"."prelink"]
"tool" = "kits/XnuPrelink/emit_prelink.py"
"kernel" = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
# sha256 of the decompressed arm64e Mach-O (kernelcache.release.iphone17, MH_FILESET, 302 entries).
"kernelcache_sha256" = "2276364d028954a1152e721820f243f9400ce5d4b13c6d57f021f010afd1eabf"
"slide" = "-0x1000000"
# AppleMobileFileIntegrity __TEXT_EXEC+0xdee0: the wrapper that calls the original AMFI initializer at
# +0xd750 and returns 0. Structurally identical to the 24A446 wrapper (+0xe7ec); the 13432-only
# iPhone17,2 patch is not used.
"early_security_init" = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff008edda30"
# A RELEASE-LTO build of the same 12377 source gives the matcher symbol-bearing anchors. Without it
# the first iOS 26 prelink left 1668 targets / 18367 sites; with it the local report dropped to
# 93 targets / 769 sites (the iOS 27 reference, not yet the exact 26 tree).
"extra_args" = ["--fileset-reference", "build/xnu/fileset-reference/mach.release.bcm2837.unstripped.noctf"]
# The iPhone17,2 fileset has every root of the 23F84 build except com.apple.iokit.IOHIDEventDriver; the
# class ships in IOHIDFamily. No --allow-missing yet: the exact reference should pair the kernel
# functions, and any remaining target is a real finding.
"roots" = ["com.apple.AppleFSCompression.AppleFSCompressionTypeZlib", "com.apple.driver.AppleARMPlatform", "com.apple.driver.AppleARMWatchdogTimer", "com.apple.driver.AppleAudioClockLibs", "com.apple.driver.AppleEffaceableStorage", "com.apple.driver.AppleIISController", "com.apple.driver.AppleM2ScalerCSCDriver", "com.apple.driver.AppleMobileFileIntegrity", "com.apple.driver.ApplePMGR", "com.apple.driver.IODARTFamily", "com.apple.filesystems.apfs", "com.apple.iokit.CoreAnalyticsFamily", "com.apple.iokit.IOAVFamily", "com.apple.iokit.IOAudio2Family", "com.apple.iokit.IOCECFamily", "com.apple.iokit.IOCryptoAcceleratorFamily", "com.apple.iokit.IOGPUFamily", "com.apple.iokit.IOHDCPFamily", "com.apple.iokit.IOMobileGraphicsFamily", "com.apple.iokit.IOReportFamily", "com.apple.iokit.IOSlowAdaptiveClockingFamily", "com.apple.iokit.IOStorageFamily", "com.apple.iokit.IOSurface", "com.apple.kec.Libm", "com.apple.kec.corecrypto", "com.apple.kext.AppleMatch", "com.apple.kext.CoreTrust", "com.apple.security.AppleImage4", "com.apple.security.sandbox", "com.apple.iokit.IOHIDFamily"]


